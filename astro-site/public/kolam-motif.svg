<?xml version="1.0" encoding="UTF-8"?>
<!--
  KOLAM LINE-ART SVG GOES HERE. Placeholder symmetric kolam (rangoli) medallion,
  single-colour line art on a transparent ground. The user will supply the final
  vector. The Kolam component paints it via CSS mask, so the stroke colour here
  does not matter (only the shape/alpha is used); recolour through the component.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Kolam ornament">
  <defs>
    <path id="k-petal" d="M50 50 C41 33 41 20 50 11 C59 20 59 33 50 50 Z"/>
    <path id="k-petal-in" d="M50 50 C45 40 45 32 50 26 C55 32 55 40 50 50 Z"/>
    <circle id="k-dot" cx="50" cy="7" r="2.1"/>
  </defs>
  <g fill="none" stroke="#000" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round">
    <circle cx="50" cy="50" r="46.5"/>
    <circle cx="50" cy="50" r="38"/>
    <use href="#k-petal" transform="rotate(0 50 50)"/>
    <use href="#k-petal" transform="rotate(45 50 50)"/>
    <use href="#k-petal" transform="rotate(90 50 50)"/>
    <use href="#k-petal" transform="rotate(135 50 50)"/>
    <use href="#k-petal" transform="rotate(180 50 50)"/>
    <use href="#k-petal" transform="rotate(225 50 50)"/>
    <use href="#k-petal" transform="rotate(270 50 50)"/>
    <use href="#k-petal" transform="rotate(315 50 50)"/>
    <use href="#k-petal-in" transform="rotate(22.5 50 50)"/>
    <use href="#k-petal-in" transform="rotate(67.5 50 50)"/>
    <use href="#k-petal-in" transform="rotate(112.5 50 50)"/>
    <use href="#k-petal-in" transform="rotate(157.5 50 50)"/>
    <use href="#k-petal-in" transform="rotate(202.5 50 50)"/>
    <use href="#k-petal-in" transform="rotate(247.5 50 50)"/>
    <use href="#k-petal-in" transform="rotate(292.5 50 50)"/>
    <use href="#k-petal-in" transform="rotate(337.5 50 50)"/>
    <circle cx="50" cy="50" r="5"/>
  </g>
  <g fill="#000">
    <use href="#k-dot" transform="rotate(22.5 50 50)"/>
    <use href="#k-dot" transform="rotate(67.5 50 50)"/>
    <use href="#k-dot" transform="rotate(112.5 50 50)"/>
    <use href="#k-dot" transform="rotate(157.5 50 50)"/>
    <use href="#k-dot" transform="rotate(202.5 50 50)"/>
    <use href="#k-dot" transform="rotate(247.5 50 50)"/>
    <use href="#k-dot" transform="rotate(292.5 50 50)"/>
    <use href="#k-dot" transform="rotate(337.5 50 50)"/>
  </g>
